- time: "15:23"
  type: fix
  title: First deploy died after a successful swap (backup pruning under pipefail); fixed with a regression test
  tags: [deploy, deploy.sh, pipefail, first-deploy, backups, test-deploy-scripts]
  files: [deploy/deploy.sh, scripts/test-deploy-scripts.sh]
  root_cause: >
    After verify passed, deploy.sh pruned old backups with `ls -1t $BACKUP_ROOT/app-*.tgz | tail |
    xargs rm`. On a first deploy there are no backups (there was no app to back up), so ls exits 2;
    with `set -euo pipefail` that killed the script. The exit handler reported "terminated
    unexpectedly during 'verify' (exit 2); the site is running". The new build was live and fine,
    but the deploy reported failed and skipped its final steps. The test suite missed it because
    every case starts from a prefix with an existing app, so a backup always exists.
  what_changed: >
    Wrote the failing test first: "the very first deploy, on an empty server, succeeds" (no app, no
    previous, no backups, service never started) -> 2 FAIL (status failed at verify). Fixed pruning
    to collect backups with nullglob into an array and only prune when there are more than
    KEEP_BACKUPS (ls -1t -- ... | xargs -r -d '\n' rm -f --). Installed via install-server.sh.
  result: >
    Suite on the server: 47 passed, 0 failed. Redeployed kolabr-20260925-112055: every step through
    "done", status succeeded, backup taken, app.previous kept.

