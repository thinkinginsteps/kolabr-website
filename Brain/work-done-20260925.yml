- time: "15:41"
  type: config
  title: Back office admin account configured (dom.hardy@paypump.net); password-hash script fixed for Node 22.15
  tags: [admin, credentials, env, scrypt, password, node, strip-types, sessions]
  files: [package.json, scripts/create-admin-password.mjs, scripts/create-deploy-zip.mjs, .gitignore,
          .env.example, README.md, DEPLOY.md, app/admin/login/page.tsx, creds.md (local, gitignored)]
  root_cause: >
    Dom asked for the admin to be dom.hardy@paypump.net with a random password stored in creds.md.
    Doing it exposed that `node scripts/create-admin-password.mjs` fails on Dom's Node 22.15
    (ERR_UNKNOWN_FILE_EXTENSION): it imports lib/admin/password.ts, and Node only strips TypeScript
    types by default from 22.18. The server (22.23) would have worked; the documented local step
    did not.
  what_changed: >
    creds.md gitignored (/creds.md) and added to the packager's refuse-to-package list before it was
    written. Generated a 28-char password (57-char alphabet without look-alike characters,
    crypto.randomInt, about 163 bits) straight into creds.md (mode 0600) and hashed it over stdin,
    so it never appeared in argv or output. Added `npm run admin:password` (node
    --experimental-strip-types --no-warnings) and pointed README, DEPLOY.md, .env.example, the
    admin login page hint and the script's own usage at it. Wrote /opt/kolabr/.env.production
    (kolabr 0600; refused if it was not empty): ADMIN_EMAIL, ADMIN_PASSWORD_HASH (scrypt, dot
    separated so .env $-expansion cannot mangle it), the other settings as commented placeholders,
    and deliberately no empty NEXT_PUBLIC_GTM_ID (empty switches GTM off). Restarted kolabr.
  result: >
    Playwright login at https://preview.kolabr.com/admin/login/ (password read from creds.md via a
    file:// page, never shown) landed on /admin/ with Deploy, Recent deploys, The server and the upload
    control. Sign-out was aborted by my navigation (POST /admin/ 400, ECONNRESET in the journal), so
    I removed only that test session (created 11:39:05Z) from state/sessions.json with an atomic
    rewrite as kolabr. Two sessions remain, created at 11:38:50Z (Firefox/Windows,
    102.117.179.134, same IP as this machine) and 11:38:54Z (Firefox/Mac, 102.117.174.50); both
    browsed /admin/copy and /admin/messages. A WhatsApp link preview also fetched /admin. Presumed
    Dom; asked him to confirm the Mac. Temporary hash files in the scratchpad were deleted.
    Noticed: the dashboard shows the live build time in UTC ("since 11:21") next to deploy times in
    local time (15:21). Not fixed.
