    in Git Bash 11 fail only because `zip` is missing). Package ready:
    publish/kolabr-20260925-101915.zip (307 files, 14.2MB, LF). NOT yet done: certificate,
    .env.production values, the first deploy itself, watchdog enable, Cloudflare DNS/SSL mode.

