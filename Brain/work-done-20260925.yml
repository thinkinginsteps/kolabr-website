    default site removed, 00-default enabled, preview enabled only when cert+key exist (prints expiry).
    Ran it on the server (idempotent re-runs). Installed `zip` on the server to run the deploy test
    suite there. DEPLOY.md "First install" rewritten around the installer, Cloudflare origin cert,
