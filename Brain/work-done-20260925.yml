- time: "14:08"
  type: fix
  title: Local verify/package flow failed on a clean checkout; fixed, plus build tracing warning
  tags: [build, typescript, next-typegen, verify-package, publish-prepare, turbopack, tracing, standalone]
  files: [package.json, lib/admin/config.ts]
  root_cause: >
    `npm run verify:package` (and so `publish:prepare`, the first step of every deploy) ran
    `tsc --noEmit` before `next build`. tsc depends on files Next generates and git ignores:
    next-env.d.ts (declares *.webp image modules) and .next/types (global PageProps/LayoutProps).
    On any fresh clone those do not exist, so tsc failed with ~130 errors before the build ran.
    The server was unaffected (deploy.sh / rebuild.sh only run `npm run build`, which generates
    them itself). Separately, lib/admin/config.ts built default data paths with an open-ended
    path.join(process.cwd(), ...parts), which made Turbopack trace the entire repo (design/,
    docs/, etc.) into .next/standalone: 145MB.
  what_changed: >
    verify:package now runs `next typegen` first (Next 16 command that writes next-env.d.ts and
    .next/types without a full build). Added a /*turbopackIgnore: true*/ comment on process.cwd()
    in lib/admin/config.ts's `local()` helper, which only builds runtime data paths
    (state, content, uploads), never code.
  result: >
    From a clean state (rm .next, next-env.d.ts, tsbuildinfo) `npm run verify:package` passes:
    typegen, tsc, eslint, build. No tracing warning; .next/standalone 145MB -> 55MB. All public
    pages static; only /admin/* and /api/* are dynamic, as documented. Remaining warning is
    environmental: a stray package.json + package-lock.json in C:\Users\domin makes Next note it
    ignored that lockfile (harmless, left alone, outside the repo).

- time: "14:08"
  type: fix
  title: Deploy packager shipped untracked local files (server access notes); now built from git's file list
  tags: [deploy, packaging, create-deploy-zip, secrets, gitignore, server.md]
  files: [scripts/create-deploy-zip.mjs, .gitignore]
  root_cause: >
    create-deploy-zip.mjs globbed **/* minus its own hand-kept ignore list, separate from
    .gitignore. Anything untracked in the repo that the list did not name was packaged and
    uploaded to the server: server.md (SSH user@host and key path) went into a zip, as would
    .local-state/ (local admin sessions, contact messages, uploaded zips), .claude/, and generated
    files. Two exclusion lists had already drifted.
  what_changed: >
    The packager now takes its file list from `git ls-files -z --cached --others
    --exclude-standard` (tracked + new-but-not-ignored), so .gitignore is the single source of
    what is local. A small PACKAGE_EXCLUDE drops committed-but-not-needed paths (design/, .claude/,
    Brain/, .vscode/). A pre-write guard refuses the whole package (no file written) if any listed
    file looks secret: .env* other than .env.example, *.key/.pem/.p12/.pfx, server.md anywhere.
    Deleted-but-uncommitted files are skipped. Fails clearly if git is unavailable.
    .gitignore now ignores /server.md and *.key. The zip that contained server.md was deleted
    (local only, never uploaded).
  decision: >
    git-based listing over adding more entries to the glob ignore list: one list cannot drift,
    and a new local file is excluded by the same rule that keeps it out of the repo.
    Uncommitted new files still ship (so a deploy does not require committing first).
  result: >
    Package: 296 files, 14.19MB, no server.md/.claude/.env/tsbuildinfo/next-env/design. A planted
    zz-test/server.md made the packager refuse with the file named and write no zip.

- time: "14:19"
  type: fix
  title: Back office deploy upload would be refused (Server Action 1MB body cap); limit raised from a shared constant
  tags: [admin, deploy, server-actions, bodySizeLimit, upload, next-config]
  files: [next.config.ts, lib/admin/limits.ts, lib/admin/config.ts]
  root_cause: >
    Deployment packages (~14MB) are uploaded via the deployPackage Server Action. Next caps Server
    Action request bodies at 1MB unless experimental.serverActions.bodySizeLimit is set, and it was
    not, so every upload in the back office would have been rejected before reaching the code.
    Never hit before because the back office had never run on a real server.
  what_changed: >
    New lib/admin/limits.ts (no "server-only", importable by next.config.ts) holds
    MAX_UPLOAD_BYTES (200MB) and SERVER_ACTION_BODY_LIMIT_BYTES (+1MB multipart headroom).
    next.config.ts sets experimental.serverActions.bodySizeLimit from it; lib/admin/config.ts
    re-exports MAX_UPLOAD_BYTES so existing imports are unchanged. nginx /admin allows 201m to match.
  decision: >
    One constant for both limits so the app check and the framework cap cannot drift. The limit is
    global to all Server Actions, but they all live under /admin, and nginx only admits bodies over
    1MB on /admin; every action but login requires an admin session first.
  result: verify:package passes; public pages still all static.

- time: "14:19"
  type: fix
  title: Windows checkout shipped CRLF to Linux; repo now pins LF via .gitattributes
  tags: [line-endings, crlf, gitattributes, deploy, sudoers, bash, windows]
  files: [.gitattributes, deploy/install-server.sh]
  root_cause: >
    core.autocrlf=true on Dom's machine checks text files out as CRLF (repo blobs are LF). The deploy
    package and the server setup files are taken from the working tree, so the server received CRLF
    shell scripts, systemd units and sudoers. visudo rejected sudoers ("syntax error" at end of
    line); bash would fail on $'\r'. First seen when running the new installer on the server.
  what_changed: >
    Added .gitattributes `* text=auto eol=lf` plus binary markers for images/fonts/zip/xlsx.
    Converted the 300+ CRLF working-tree files to LF in place (content identical to HEAD; git's
    real diff is unchanged). install-server.sh now refuses to run if any source file has CRLF.
    Side effect: `git status` lists ~300 files as " M" with no content diff (stale index stat after
    the attribute change; `git update-index --refresh` reports "needs update"). Cosmetic; clears when
    the files are next staged/committed.
  result: Rebuilt package contains zero CR characters (checked deploy/deploy.sh and package.json in the zip).

- time: "14:19"
  type: fix
  title: nginx config pointed at /srv/kolabr (would 404 all JS/CSS), dropped security headers, and was not Cloudflare-aware
  tags: [nginx, cloudflare, real-ip, rate-limit, headers, preview, tls, origin-certificate]
  files: [deploy/nginx.conf (deleted), deploy/nginx/conf.d/kolabr.conf, deploy/nginx/conf.d/cloudflare-realip.conf,
          deploy/nginx/snippets/kolabr-site.conf, deploy/nginx/snippets/kolabr-headers.conf,
          deploy/nginx/snippets/kolabr-proxy.conf, deploy/nginx/snippets/kolabr-tls.conf,
          deploy/nginx/sites/00-default.conf, deploy/nginx/sites/preview.kolabr.com.conf,
          deploy/nginx/sites/kolabr.com.conf, app/api/contact/route.ts]
  root_cause: >
    deploy/nginx.conf used root /srv/kolabr/public and alias /srv/kolabr/.next/static while the app
    lives in /opt/kolabr/app: every /_next/static asset would 404 (no fallback), site unstyled and
    without JS. Locations with their own add_header (/admin, /_next/static, static files) silently
    dropped all server-level security headers (nginx inheritance rule). expires + add_header
    Cache-Control produced duplicate Cache-Control. Behind Cloudflare, $remote_addr is the CF edge,
    so the contact-form and admin-login rate limiters (X-Real-IP) would bucket all visitors together.
    It assumed certbot/Let's Encrypt and used `http2 on;`, which nginx 1.24 (Ubuntu 24.04) lacks.
  what_changed: >
    Split into conf.d (upstream; map $host -> X-Robots-Tag noindex for preview.kolabr.com;
    Cloudflare set_real_ip_from ranges + real_ip_header CF-Connecting-IP), snippets (site body shared
    by preview and live; headers snippet re-included in every add_header location; proxy snippet;
    TLS snippet on /etc/ssl/kolabr/origin.{pem,key}), and sites (00-default rejects unknown hosts:
    444 on 80, ssl_reject_handshake on 443; preview.kolabr.com; kolabr.com + www redirect, installed
    but not enabled). Paths fixed to /opt/kolabr/app. `^~ /_next/static/` so the image regex cannot
    steal hashed assets. `listen 443 ssl http2` for 1.24. /admin body 201m.
  result: >
    On the server, nginx -t passes for the enabled set, and for preview + live together using a
    throwaway self-signed cert in a scratch config. Bare-IP HTTP request gets connection closed (444).

