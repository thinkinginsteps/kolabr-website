<!-- Holding page for kolabr.com until launch. Served by nginx on its own (deploy/nginx/sites/
     kolabr.com-holding.conf), not by the site, so nothing else is reachable on this host.
     Colours are the site tokens from app/globals.css. Generated from public/logo.svg. -->
<style>
  @font-face {
    font-family: "Switzer";
    src: url("/Switzer-Regular.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }
  :root {
    --ink: #33505b;
    --ink-muted: #5d7380;
    --surface: #ffffff;
    --surface-tint: #f2f6fa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 16px;
    background: radial-gradient(ellipse at center, var(--surface) 0%, var(--surface-tint) 100%);
    color: var(--ink);
    font-family: "Switzer", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* The logo alone is centred; the tagline hangs below it, out of the layout, so it does not
     pull the logo off centre. */
  main {
    position: relative;
    animation: arrive 700ms ease-out both;
  }
  h1 { margin: 0; line-height: 0; }
  .logo { display: block; width: clamp(180px, 36vw, 340px); height: auto; }
  p {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin: clamp(16px, 3vw, 28px) 0 0;
    white-space: nowrap;
    color: var(--ink-muted);
    font-size: clamp(0.8125rem, 1.4vw, 0.9375rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  @keyframes arrive {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }
</style>
