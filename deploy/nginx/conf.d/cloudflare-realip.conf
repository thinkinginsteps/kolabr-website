# /etc/nginx/conf.d/cloudflare-realip.conf
#
# The site is proxied by Cloudflare, so every connection nginx sees comes from a Cloudflare edge.
# Without this, $remote_addr is Cloudflare's address: the contact form and admin login rate
# limiters (which read X-Real-IP, set from $remote_addr) would put every visitor in the same few
# buckets, and five messages from anyone would lock out everyone behind that edge.
#
# nginx takes the visitor's address from CF-Connecting-IP, but ONLY when the connection really
# comes from one of the ranges below. A request sent straight to the server with a forged
# CF-Connecting-IP is not from a trusted range, so the header is ignored.
#
# Source: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6, fetched
# 25 September 2026. Cloudflare changes these rarely and announces it in advance.
# TODO: if Cloudflare adds a range, visitors arriving through it share one rate limit bucket until
# this list is updated. Re-check the two URLs above before go-live and whenever Cloudflare notifies.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
