# /etc/nginx/conf.d/kolabr.conf
#
# http-level pieces shared by every Kolabr server block (sites/*.conf).

# The Node server (see DEPLOY.md) listens on 127.0.0.1:3000 and is never exposed directly.
upstream kolabr_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# The preview host must never be indexed: it serves the same pages as the live site. The pages'
# canonical URLs already point at https://kolabr.com, and this header makes it explicit. An empty
# value means nginx sends no header at all, so the live hosts are unaffected.
map $host $kolabr_robots {
    preview.kolabr.com  "noindex, nofollow";
    default             "";
}
