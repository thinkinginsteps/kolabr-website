# /etc/nginx/sites-available/00-default.conf  (replaces Ubuntu's own "default" site)
#
# Anything that is not a Kolabr hostname gets nothing: requests to the bare IP, scanners, and
# someone else's domain pointed at this server. Without this nginx would answer them with the
# first server block it finds, which is the site.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    # Refuse the TLS handshake outright, so no certificate is ever shown for an unknown name.
    ssl_reject_handshake on;
}
