# /etc/nginx/sites-available/kolabr.com.conf
#
# The live site. Installed but NOT enabled until go-live (DEPLOY.md, "Going live"). Needs the
# origin certificate to cover kolabr.com and www.kolabr.com.
#
# One canonical hostname: everything else redirects to https://kolabr.com, so search engines only
# ever see one address for a page.

server {
    listen 80;
    listen [::]:80;
    server_name kolabr.com www.kolabr.com;
    return 301 https://kolabr.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kolabr.com;

    include snippets/kolabr-tls.conf;
    return 301 https://kolabr.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kolabr.com;

    include snippets/kolabr-tls.conf;
    include snippets/kolabr-site.conf;
}
