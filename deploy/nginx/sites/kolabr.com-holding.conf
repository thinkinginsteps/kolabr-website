# /etc/nginx/sites-available/kolabr.com-holding.conf
#
# kolabr.com before launch: a static "coming soon" page (deploy/holding/, installed to
# /var/www/kolabr-holding), served by nginx alone. The site itself is never reachable on this
# host: no proxy to the app, so no pages, no /admin, no API. The site runs on preview.kolabr.com.
#
# Exclusive with kolabr.com.conf (the live site): install-server.sh enables this one only while
# kolabr.com.conf is not enabled. Going live swaps them (DEPLOY.md, "Going live").

server {
    listen 80;
    listen [::]:80;
    server_name kolabr.com www.kolabr.com;
    return 301 https://kolabr.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kolabr.com;

    include snippets/kolabr-tls.conf;
    return 301 https://kolabr.com/;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kolabr.com;

    include snippets/kolabr-tls.conf;

    root /var/www/kolabr-holding;

    # Not for search engines yet: the real site launches on this address, and a "coming soon" page
    # should not be what gets indexed. Crawlers may fetch it (robots.txt allows) so they see this.
    # Every location that adds a header of its own repeats both lines (nginx inheritance rule).
    include snippets/kolabr-headers.conf;
    add_header X-Robots-Tag "noindex" always;

    location = / {
        try_files /index.html =404;
        include snippets/kolabr-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        # Never cached, so the launch shows up the moment the site is switched over.
        add_header Cache-Control "no-cache" always;
    }

    location = /favicon.svg { try_files $uri =404; }
    location = /Switzer-Regular.woff2 { try_files $uri =404; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Any other address (an old link, /pricing, /admin) lands on the holding page. Temporary: at
    # launch these become real pages.
    location / {
        return 302 /;
    }
}
