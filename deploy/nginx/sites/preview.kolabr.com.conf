# /etc/nginx/sites-available/preview.kolabr.com.conf
#
# The site before launch. Served exactly as the live site will be (snippets/kolabr-site.conf),
# except that every response carries X-Robots-Tag: noindex (conf.d/kolabr.conf). Before launch
# kolabr.com shows the holding page instead (kolabr.com-holding.conf); DEPLOY.md, "Going live".
#
# `listen ... ssl http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx 1.24, and the
# separate directive needs 1.25.1.

server {
    listen 80;
    listen [::]:80;
    server_name preview.kolabr.com;
    return 301 https://preview.kolabr.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.kolabr.com;

    include snippets/kolabr-tls.conf;
    include snippets/kolabr-site.conf;
}
