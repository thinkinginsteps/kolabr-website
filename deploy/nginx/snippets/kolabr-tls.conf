# /etc/nginx/snippets/kolabr-tls.conf
#
# TLS between Cloudflare and this server, using a Cloudflare origin certificate. Browsers never
# see this certificate (they get Cloudflare's), so it is only trusted with Cloudflare's SSL mode
# set to "Full (strict)". Any other mode is wrong here: "Flexible" talks plain HTTP to port 80,
# which redirects to HTTPS, and the visitor loops forever.
#
# Origin certificates are issued for years and are not renewed by certbot, so there is no renewal
# hook. Note the expiry date when installing one, and replace it before then:
#   openssl x509 -enddate -noout -in /etc/ssl/kolabr/origin.pem
#
# Files, installed by hand (DEPLOY.md, "First install"):
#   /etc/ssl/kolabr/origin.pem   the certificate          root:root 0644
#   /etc/ssl/kolabr/origin.key   its private key          root:root 0600

ssl_certificate /etc/ssl/kolabr/origin.pem;
ssl_certificate_key /etc/ssl/kolabr/origin.key;
ssl_session_cache shared:kolabr_ssl:10m;
ssl_session_timeout 1d;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
