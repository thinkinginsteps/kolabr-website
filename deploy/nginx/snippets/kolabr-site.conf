# /etc/nginx/snippets/kolabr-site.conf
#
# The body of the Kolabr site, shared by the preview and live server blocks so the two can never
# serve differently. A server block supplies listen, server_name and TLS, then includes this.

root /opt/kolabr/app/public;

# The contact form is tiny. The back office is the exception, below.
client_max_body_size 1m;

include snippets/kolabr-headers.conf;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml
           application/rss+xml image/svg+xml font/woff2;

# The back office receives deployment packages through a Server Action: bigger bodies, longer
# timeouts (a deploy hands off in seconds, but the upload itself can take a while), never cached.
# 201m matches SERVER_ACTION_BODY_LIMIT_BYTES in lib/admin/limits.ts: a 200MB package plus the
# multipart overhead.
location /admin {
    client_max_body_size 201m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    include snippets/kolabr-headers.conf;
    add_header Cache-Control "no-store" always;
    include snippets/kolabr-proxy.conf;
}

# Hashed build assets, straight from disk: safe to cache forever. ^~ so the image rule below
# never catches a .png or .woff2 in here and sends it to the app.
location ^~ /_next/static/ {
    alias /opt/kolabr/app/.next/static/;
    access_log off;
    include snippets/kolabr-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Optimised images are made by the app, which sets their cache headers.
location /_next/image {
    include snippets/kolabr-proxy.conf;
}

# Files in public/ (the logo and anything added later) come from disk; anything else with an
# image extension (the icon and social image routes) falls through to the app.
location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2)$ {
    try_files $uri @app;
    access_log off;
    include snippets/kolabr-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
}

location / {
    try_files $uri @app;
}

location @app {
    include snippets/kolabr-proxy.conf;
    proxy_read_timeout 30s;
}
