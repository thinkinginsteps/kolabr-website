# /etc/nginx/snippets/kolabr-proxy.conf
#
# Passing a request to the Node server. Used by every location that reaches the app.

proxy_pass http://kolabr_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The contact form and admin login rate limiters read X-Real-IP. Behind Cloudflare, $remote_addr
# is the visitor only because conf.d/cloudflare-realip.conf restores it; without that every
# visitor looks like a Cloudflare edge.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Server Actions compare Origin with this host (CSRF check); it must be the public hostname.
proxy_set_header X-Forwarded-Host $host;
