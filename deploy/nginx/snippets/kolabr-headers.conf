# /etc/nginx/snippets/kolabr-headers.conf
#
# Response headers for every Kolabr response. Included at server level AND inside every location
# that sets an add_header of its own: nginx drops all inherited add_header directives in a
# location that declares any, so without the repeat those locations would go out bare.
#
# No CSP here: the site loads Google Tag Manager only after consent, so a policy has to allow
# googletagmanager.com and whatever GTM loads. Add one deliberately rather than by accident.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Set per host in conf.d/kolabr.conf: "noindex, nofollow" on preview, nothing on the live hosts.
add_header X-Robots-Tag $kolabr_robots always;
