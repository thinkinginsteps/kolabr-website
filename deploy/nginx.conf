# kolabr.com. Copy to /etc/nginx/sites-available/kolabr.com and symlink into sites-enabled.
# The Node server (see DEPLOY.md) listens on 127.0.0.1:3000 and is never exposed directly.

upstream kolabr_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# One canonical hostname: everything else redirects to https://kolabr.com, so search engines
# only ever see one address for a page.
server {
    listen 80;
    listen [::]:80;
    server_name kolabr.com www.kolabr.com;

    # Certbot's challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://kolabr.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kolabr.com;

    ssl_certificate /etc/letsencrypt/live/kolabr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolabr.com/privkey.pem;

    return 301 https://kolabr.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kolabr.com;

    ssl_certificate /etc/letsencrypt/live/kolabr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kolabr.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/kolabr/public;

    # The contact form is tiny; the back office receives deployment packages.
    client_max_body_size 1m;

    # The back office: bigger uploads, longer timeouts (a deploy hands off in seconds, but the
    # upload itself can take a while), and never cached.
    location /admin {
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
        proxy_pass http://kolabr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Security headers. No CSP here: the site loads Google Analytics only after consent, so a
    # policy has to allow googletagmanager.com. Add one deliberately rather than by accident.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/rss+xml image/svg+xml font/woff2;

    # Hashed build assets: safe to cache forever.
    location /_next/static/ {
        alias /srv/kolabr/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optimised images keep their own cache headers from the app, but the bytes come from disk.
    location /_next/image {
        proxy_pass http://kolabr_app;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
    }

    # Files in public/: the logo and anything added later.
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2)$ {
        try_files $uri @app;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://kolabr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The contact form's rate limiter reads X-Real-IP. Without it every visitor looks
        # like the proxy and five messages would exhaust the limit for everyone.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
